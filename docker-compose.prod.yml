# Production overlay. Adds Caddy (TLS + reverse proxy), restart policies,
# and hides internal services from the public network.
#
# Usage on the server:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    restart: unless-stopped
    ports: !reset []          # postgres is internal-only in prod
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    restart: unless-stopped
    ports: !reset []          # redis is internal-only in prod
    deploy:
      resources:
        limits:
          memory: 256m

  mosquitto:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  mediamtx:
    restart: unless-stopped
    ports: !override          # only RTSP for cameras; HLS goes through Caddy
      - "8554:8554"
    deploy:
      resources:
        limits:
          memory: 512m

  backend:
    restart: unless-stopped
    ports: !reset []          # backend is reached via Caddy / frontend rewrite
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      # Prod moves actuator to management.server.port=9001 (separate from
      # public 3001) — probe the management port for liveness.
      test: ["CMD-SHELL", "wget -qO- http://localhost:9001/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    restart: unless-stopped
    ports: !reset []          # frontend is reached via Caddy
    deploy:
      resources:
        limits:
          memory: 512m

  caddy:
    image: caddy:2-alpine
    container_name: corevia-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - mediamtx

volumes:
  caddy_data:
  caddy_config:
