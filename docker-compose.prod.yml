# Production overlay. Adds Caddy (TLS + reverse proxy), restart policies,
# and hides internal services from the public network.
#
# Usage on the server:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    restart: unless-stopped
    ports: !reset []          # postgres is internal-only in prod

  redis:
    restart: unless-stopped
    ports: !reset []          # redis is internal-only in prod

  mosquitto:
    restart: unless-stopped

  mediamtx:
    restart: unless-stopped
    ports: !override          # only RTSP for cameras; HLS goes through Caddy
      - "8554:8554"

  backend:
    restart: unless-stopped
    ports: !reset []          # backend is reached via Caddy / frontend rewrite

  frontend:
    restart: unless-stopped
    ports: !reset []          # frontend is reached via Caddy

  caddy:
    image: caddy:2-alpine
    container_name: corevia-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - mediamtx

volumes:
  caddy_data:
  caddy_config:
