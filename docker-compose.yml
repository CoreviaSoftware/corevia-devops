name: corevia

# Shared base: pulls pre-built images from GHCR.
# For local builds from sibling smartcity-be/ and smartcity-fe/ source trees,
# add the -f docker-compose.local.yml overlay (see that file's header).
# For the Windows deployment (IP:PORT, restart policies, prod profile), add
# the -f docker-compose.windows.yml overlay — this is the normal deploy path.

services:
  postgres:
    # Pin to a fixed minor. timescale/timescaledb:latest-pg16 is mutable and
    # has rotated under us before (dev-preview .so versions ended up in the
    # PG catalog, then the next pull replaced them with a stable that didn't
    # carry the dev .so file -- connections fail at extension load).
    image: timescale/timescaledb:2.20.3-pg16
    container_name: corevia-db
    environment:
      # User / db name are pinned to 'smartcity' because application-prod.yml
      # and application-local.yml hardcode them. Don't parameterize -- a typo
      # in .env would silently break Flyway.
      POSTGRES_USER: smartcity
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartcity}
      POSTGRES_DB: smartcity
    ports:
      - "${DB_PORT_HOST:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcity"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: corevia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: corevia-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  mediamtx:
    image: bluenviron/mediamtx:1.9.3
    container_name: corevia-mediamtx
    environment:
      # MediaMTX overrides any YAML key via MTX_<UPPERCASE_KEY>. The auth
      # callback points at the backend service inside the compose network.
      MTX_AUTHHTTPADDRESS: http://backend:3001/internal/mediamtx/auth?secret=${MEDIAMTX_SHARED_SECRET:?MEDIAMTX_SHARED_SECRET must be set}
    ports:
      - "8554:8554"
      - "8888:8888"
      - "9997:9997"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml

  backend:
    image: ghcr.io/coreviasoftware/corevia-be:${IMAGE_TAG_BE:-latest}
    container_name: corevia-backend
    environment:
      # Non-secret config (DB host/port/name/user, Redis/MQTT URLs, mail host
      # and user, CORS, public URLs, MediaMTX URLs and api username,
      # bootstrap-admin email) is hardcoded in application-prod.yml and
      # application-local.yml. Only secrets pass through env.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-prod}
      PORT: 3001
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY must be set}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD must be set}
      MEDIAMTX_API_PASSWORD: ${MEDIAMTX_API_PASSWORD:?MEDIAMTX_API_PASSWORD must be set}
      MEDIAMTX_SIGNING_KEY: ${MEDIAMTX_SIGNING_KEY:?MEDIAMTX_SIGNING_KEY must be set}
      MEDIAMTX_SHARED_SECRET: ${MEDIAMTX_SHARED_SECRET:?MEDIAMTX_SHARED_SECRET must be set}
      DEV_ADMIN_ACCOUNTS: ${DEV_ADMIN_ACCOUNTS:-}
      # Portal credentials the frontend prefills into the Signworld and webmail
      # logins. Served only to authenticated admins; never exposed as NEXT_PUBLIC_*.
      SIGNWORLD_USERNAME: ${SIGNWORLD_USERNAME:-}
      SIGNWORLD_PASSWORD: ${SIGNWORLD_PASSWORD:-}
      WEBMAIL_LOGIN_URL: ${WEBMAIL_LOGIN_URL:-}
      WEBMAIL_USER: ${WEBMAIL_USER:-}
      WEBMAIL_PASSWORD: ${WEBMAIL_PASSWORD:-}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started

  frontend:
    image: ghcr.io/coreviasoftware/corevia-fe:${IMAGE_TAG_FE:-latest}
    container_name: corevia-frontend
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:3001
    ports:
      - "3030:3030"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:
